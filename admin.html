<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>Admin Dashboard</h1>

    <table border="1" width="100%" cellpadding="10">

        <tr>
            <th>Username</th>
            <th>Score</th>
        </tr>

        {% for row in data %}

        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}/10</td>
        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
