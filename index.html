<!DOCTYPE html>
<html>
<head>
    <title>Learning Hub Quiz</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Learning Hub - Python Quiz</h1>

        <form method="POST">
            {% for q in questions %}
                <div class="question-box">
                    <h3>{{ q.question }}</h3>

                    {% for option in q.options %}
                        <input type="radio" name="{{ loop.parent.index0 }}" value="{{ option }}" required>
                        {{ option }}<br>
                    {% endfor %}
                </div>
            {% endfor %}

            <button type="submit">Submit</button>
        </form>

        {% if score is not none %}
            <h2>Your Score: {{ score }}/10</h2>
        {% endif %}
    </div>
</body>
</html>
